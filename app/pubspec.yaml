name: nestalla
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: '1.0.6'
  go_router: ^18.1.2
  provider: ^6.1.5+1
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
